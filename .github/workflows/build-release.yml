name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Package and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Distribution Archive
        run: |
          mkdir -p dist/web-stories-templates
          rsync -av --exclude='.git*' --exclude='dist' --exclude='.github' ./ dist/web-stories-templates/
          cd dist
          zip -r ../web-stories-templates.zip web-stories-templates
          cd ..
          ls -lh web-stories-templates.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: web-stories-templates.zip
          draft: false
          prerelease: false
          generate_release_notes: true
